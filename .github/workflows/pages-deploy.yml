name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static pages
        run: python3 tools/build.py

      # 公開対象から社内向けファイルを除外する。
      # path: '.' は .git と .github 以外を全部配信するため、除外しないと
      # README や原稿 Markdown がそのままURLで読める状態になる。
      # ビルドの後に実行すること（build.py が *.md を入力に使うため）。
      - name: Strip internal files from the artifact
        run: |
          set -eux
          rm -f  README.md netlify.toml
          rm -rf tools
          find blog news -maxdepth 1 -name '*.md' -delete
          # 除外漏れの検査：公開してはいけないものが残っていたら失敗させる
          test ! -e README.md
          test ! -e tools
          test -z "$(find blog news -maxdepth 1 -name '*.md')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
