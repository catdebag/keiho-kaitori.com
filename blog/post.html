<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事ページへ移動します｜株式会社KEIHO</title>
<!-- 旧URL（/blog/post.html?slug=xxx）を新しい静的URL（/blog/xxx/）へ転送する互換ページ。
     GitHub Pages は 301 を返せないため、canonical + noindex + JS転送で代替しています。 -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://keiho-kaitori.com/blog/">
<script>
  (function () {
    var slug = new URLSearchParams(location.search).get('slug');
    location.replace(slug && /^[A-Za-z0-9._-]+$/.test(slug) ? '/blog/' + slug + '/' : '/blog/');
  })();
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #FAFAF6; color: #4a5e52;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
  a { color: #1A5C3A; }
</style>
</head>
<body>
<p>記事ページへ移動します。<br>
自動で移動しない場合は <a href="/blog/">ブログ一覧</a> をご覧ください。</p>
</body>
</html>
